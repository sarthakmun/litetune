[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=68.2.2",
  "wheel>=0.41.2",
]

[project]
name = "litetune"
version = "1.0.0"
description = "High-Performance Large Language Model (LLM) Fine-Tuning, PEFT (QLoRA/LoRA), Quantization, and Distributed Scaling Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sarthak Mun", email = "sarthak.mun03@gmail.com" },
]
keywords = [
  "llm",
  "fine-tuning",
  "qlora",
  "lora",
  "peft",
  "deep-learning",
  "pytorch",
  "lightning",
  "distributed-training",
  "transformers",
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1.0",
  "lightning>=2.1.0",
  "huggingface-hub>=0.20.0",
  "tokenizers>=0.15.0",
  "transformers>=4.38.0",
  "jsonargparse>=4.27.0",
  "safetensors>=0.4.0",
  "psutil>=5.9.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
quantization = [
  "bitsandbytes>=0.43.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
litetune = "litetune.__main__:main"
litgpt = "litgpt.__main__:main"

[tool.setuptools.packages.find]
include = ["litetune*", "litgpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
